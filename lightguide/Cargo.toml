[package]
name = "lightguide"
version = "0.1.0"
edition.workspace = true
description = "Lighting output for MIDI visualizers — driver-agnostic interface, first driver is Komplete Kontrol S-series."

[dependencies]
hidapi = "2.6"
log.workspace = true
anyhow.workspace = true

[dependencies.clap]
version = "4.5"
features = ["derive"]

[[bin]]
name = "lightguide-test"
path = "src/bin/lightguide-test.rs"
